name: Build DEV Cloudflare Artifact

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build-dev-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build isolated development preview
        env:
          VITE_APP_ENV: development
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npm run build

      - name: Add SPA fallback for static hosting
        run: cp dist/index.html dist/404.html

      - name: Upload Cloudflare-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtab-company-website-dev-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
