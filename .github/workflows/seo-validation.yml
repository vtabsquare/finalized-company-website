name: Website SEO validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Confirm published SEO discovery assets
        run: |
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          grep -q 'https://www.vtabsquare.com/' dist/sitemap.xml
          grep -q 'name="description"' dist/index.html
          grep -q 'sql-server-to-databricks-migration' dist/sitemap.xml
          grep -q 'power-bi-consulting-services' dist/sitemap.xml
          grep -q 'ai-application-development' dist/sitemap.xml
          test -s dist/sql-server-to-databricks-migration/index.html
          test -s dist/power-bi-consulting-services/index.html
          test -s dist/ai-application-development/index.html
          grep -q '<h1>SQL Server to Databricks Migration Services</h1>' dist/sql-server-to-databricks-migration/index.html
          test -s dist/case-studies/sql-server-to-databricks-migration-factory/index.html
          grep -q 'SQL Server to Databricks AI Migration Factory' dist/case-studies/sql-server-to-databricks-migration-factory/index.html
          grep -q 'BreadcrumbList' dist/sql-server-to-databricks-migration/index.html
          grep -q 'Organization' dist/power-bi-consulting-services/index.html

      - name: Confirm original sitemap routes have distinct crawlable HTML
        run: |
          for route in solutions industries lab about careers contact architecture/ai-reporting-platform architecture/qlik-to-powerbi-migration; do
            file="dist/$route/index.html"
            test -s "$file"
            grep -q "<h1>" "$file"
            grep -q "https://www.vtabsquare.com/$route" "$file"
            if grep -q '<link rel="canonical" href="https://www.vtabsquare.com/" />' "$file"; then
              echo "Homepage canonical incorrectly used for $route"
              exit 1
            fi
          done
          grep -q '<h1>Contact VTAB Square</h1>' dist/contact/index.html
          grep -q '<h1>AI Reporting Platform</h1>' dist/architecture/ai-reporting-platform/index.html
          grep -q '<h1>Qlik to Power BI Migration</h1>' dist/architecture/qlik-to-powerbi-migration/index.html
